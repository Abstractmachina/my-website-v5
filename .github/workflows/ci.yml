name: CI Pipeline

on:
  push:
    branches: [ "dev" ]

  pull_request:
    branches: [ "main" ]

# allow workflow to write to this repo, 
# needed for auto-promotion
permissions:
  contents: write

jobs:
  unit-and-integration:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Use the same major version you use locally
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm" # This speeds up future runs automatically!
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Unit & Integration Tests
        run: pnpm test:unit && pnpm test:int
        env:
          PAYLOAD_SECRET: "any-random-string-for-testing" # Inject a dummy secret for tests
          DATABASE_URL: "postgres://test_user:test_password@localhost:5432/test_db"

  e2e:
    name: End-to-End Tests
    needs: unit-and-integration
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Use the same major version you use locally

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm" # This speeds up future runs automatically!

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm test
        env:
          PAYLOAD_SECRET: "any-random-string-for-testing" # Inject a dummy secret for tests
          DATABASE_URL: "postgres://test_user:test_password@localhost:5432/test_db"


          # If any test above fails, GitHub skips this step entirely.
      - name: 🚀 Auto-Promote to Main
        run: git push origin HEAD:refs/heads/main