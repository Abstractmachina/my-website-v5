name: Deploy to Production

# Only trigger when code is merged or pushed directly to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    # This groups your deployments in GitHub's UI and allows you to set up rules 
    # (like requiring a manual click to approve before the deployment runs).
    environment: production 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Payload CMS usually needs to compile its React admin panel before deploying
      - name: Build the application
        run: pnpm build
        env:
          # Pull these from GitHub Settings -> Secrets and variables -> Actions
          PAYLOAD_SECRET: ${{ secrets.PROD_PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.PROD_DATABASE_URI }}

      # ---------------------------------------------------------
      # THE FINAL STEP: This changes based on your host!
      # ---------------------------------------------------------
      - name: Deploy to Server
        run: |
          echo "Replace this step with your hosting provider's deployment command."