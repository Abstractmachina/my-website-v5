name: Test Project

on: push

jobs:
  test:
  runs-on: ubuntu-latest
  container:
    image: node 22
  steps:
    -name: Checkout code
    uses: actions/checkout@v3

    -name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"

    -name: Install dependencies
    run: npm ci

  -name: Run tests
    run: npm test