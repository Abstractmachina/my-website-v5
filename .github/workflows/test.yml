name: Test Project

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Use the same major version you use locally

      # 2. Setup Node and enable pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm" # This speeds up future runs automatically!

      # 3. Install dependencies using pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run tests
      - name: Run tests
        run: pnpm test
        env:
          PAYLOAD_SECRET: "any-random-string-for-testing" # Inject a dummy secret for tests